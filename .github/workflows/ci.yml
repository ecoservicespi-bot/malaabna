name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-app:
    name: Desktop app checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: malaabna-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: malaabna-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check source
        run: npm run check

      - name: Run app tests
        run: npm test

  sync-server:
    name: Sync server checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check source and web sync
        run: npm run check

      - name: Run server tests
        run: npm test

  windows-installer:
    name: Windows installer
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - desktop-app
      - sync-server
    runs-on: windows-latest
    defaults:
      run:
        working-directory: malaabna-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: malaabna-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist

      - name: Smoke-test clean installation
        shell: pwsh
        run: |
          $installer = (Resolve-Path "dist/Malaabna-Setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "malaabna-install-smoke"
          $process = Start-Process -FilePath $installer -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Installer exited with code $($process.ExitCode)"
          }
          if (-not (Test-Path (Join-Path $installDir "ملعبنا.exe"))) {
            throw "Installed app executable was not found"
          }

      - name: Verify installer and print checksum
        shell: pwsh
        run: |
          $installer = Get-Item "dist/Malaabna-Setup.exe"
          if ($installer.Length -lt 10MB) {
            throw "Installer is unexpectedly small: $($installer.Length) bytes"
          }
          Get-FileHash $installer.FullName -Algorithm SHA256

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: malaabna-windows-x64
          path: malaabna-app/dist/Malaabna-Setup.exe
          if-no-files-found: error
          retention-days: 14