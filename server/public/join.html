<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>الانضمام إلى ملعبنا</title><meta name="theme-color" content="#0b3d24">
<link rel="icon" href="/app/icon-192.png">
<style>
:root{--g:#0b3d24;--g2:#14653b;--gold:#d9a637;--bg:#f4f7f5;--card:#fff;--t:#1d2a23;--bd:#cfdcd4;--red:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#0d1712;--card:#15231b;--t:#e8f1ec;--bd:#2b4336;--red:#ff7b6b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7}
header{background:linear-gradient(160deg,var(--g),var(--g2));color:#fff;text-align:center;padding:28px 16px 40px}
header img{width:88px;height:88px}h1{margin:6px 0 2px;color:var(--gold);font-size:24px}header p{margin:0;opacity:.9}
main{max-width:460px;margin:-22px auto 40px;padding:0 14px}
.card{background:var(--card);border-radius:16px;padding:18px 20px;margin-bottom:14px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
label{display:block;font-weight:700;margin:12px 0 4px;font-size:14px}
input{width:100%;min-height:44px;border:1px solid var(--bd);border-radius:10px;padding:0 12px;font-size:16px;background:transparent;color:inherit}
.btn{display:block;width:100%;margin-top:16px;padding:12px 20px;border:0;border-radius:12px;background:var(--g2);color:#fff;font-size:16px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
.btn.gold{background:var(--gold);color:#2b1f00}.btn[disabled]{opacity:.6}
.err{color:var(--red);margin-top:10px;min-height:20px;font-size:14px}small{opacity:.75}ol{padding-inline-start:20px;margin:6px 0}
.pill{display:inline-block;background:rgba(217,166,55,.18);border-radius:8px;padding:2px 10px;font-weight:700;direction:ltr}
</style></head><body>
<header><img src="/app/icon-512.png" alt="ملعبنا"><h1>ملعبنا</h1><p id="school">دعوة للانضمام</p></header>
<main>
<div class="card" id="box"><div>جارٍ التحقق من الدعوة…</div></div>
</main>
<script src="/join.js" defer></script></body></html>
